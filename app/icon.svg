    <path d="M0.1 6.1 H17.4 V22.5 H34 V40 H0.1 Z" fill="#fcfcfe"/>
    <path d="M30.3 0 L39.9 9.7 L30.3 19.4 L20.7 9.7 Z" fill="#c8ff00"/>
  </g>
